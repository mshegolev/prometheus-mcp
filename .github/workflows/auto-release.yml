name: Auto Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The carriers must already agree before we touch anything: a release
      # started from a drifted tree would just propagate the drift.
      - name: Verify version carriers are in sync
        run: python scripts/bump_version.py --check

      # One tool bumps every carrier (pyproject.toml, __init__.py, and BOTH
      # version fields of server.json). It edits only the version line/field —
      # the __init__ module docstring and the whole of server.json survive.
      - name: Bump version in all carriers
        id: new_version
        env:
          BUMP_TYPE: ${{ github.event.inputs.version_bump }}
        run: |
          NEW_VERSION=$(python scripts/bump_version.py --bump "$BUMP_TYPE" --quiet)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Verify the bump landed everywhere
        run: python scripts/bump_version.py --check

      - name: Create release commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pyproject.toml src/prometheus_mcp/__init__.py server.json
          git commit -m "Bump version to ${{ steps.new_version.outputs.version }}"
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release version ${{ steps.new_version.outputs.version }}"

      - name: Push changes
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          release_name: Release ${{ steps.new_version.outputs.version }}
          draft: false
          prerelease: false

      # Events caused by GITHUB_TOKEN (the tag push above) do not trigger other
      # workflows, so start the PyPI publish explicitly on the new tag.
      # Same workflow file + `pypi` environment, so Trusted Publisher still matches.
      - name: Trigger PyPI publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "v${{ steps.new_version.outputs.version }}"
